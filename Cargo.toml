[package]
name = "sproto-rust"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of the sproto binary serialization protocol"
license = "MIT"
repository = "https://github.com/myzhan/sproto-rust"
authors = ["myzhan <scau.myzhan@gmail.com>"]
keywords = ["sproto", "serialization", "binary", "protocol"]
categories = ["encoding", "parser-implementations"]
autobenches = false
autoexamples = false

[lib]
name = "sproto"

[features]
default = ["derive"]
derive = ["dep:sproto-derive"]

[dependencies]
thiserror = "2"
sproto-derive = { version = "0.1.0", path = "sproto-derive", optional = true }

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sproto_bench"
harness = false
path = "benches/sproto_bench.rs"

[[example]]
name = "benchmark"
path = "benches/benchmark.rs"

[profile.release]
lto = true
codegen-units = 1

[workspace]
members = ["sproto-lua", "sproto-derive"]
