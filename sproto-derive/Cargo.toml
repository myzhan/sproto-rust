[package]
name = "sproto-derive"
version = "0.1.0"
edition = "2021"
description = "Derive macros for sproto serialization"
license = "MIT"
repository = "https://github.com/myzhan/sproto-rust"
authors = ["myzhan <scau.myzhan@gmail.com>"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
